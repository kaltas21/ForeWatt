<svg width="256" height="256" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bolt-gradient" x1="24.4" y1="31" x2="34.6" y2="10.4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd400"/>
      <stop offset="100%" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="shadow-gradient" x1="26" y1="34" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0v8" stroke="#0b1220" stroke-width=".5" stroke-opacity=".05"/>
    </pattern>
    <filter id="bolt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Grid background -->
  <path fill="url(#grid-pattern)" d="M0 0h64v64H0z"/>
  <!-- Forecast shadow -->
  <path d="m26 34 32-16v28Z" fill="url(#shadow-gradient)"/>
  <!-- Actual data line (solid) -->
  <path d="M8 42c6-14 12 2 18-8" stroke="#0b1220" stroke-width="3" stroke-opacity=".35" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forecast line (dashed) -->
  <path d="M34 32c8-12 16 2 24-12" stroke="#0b1220" stroke-width="3" stroke-opacity=".35" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forecast end circle -->
  <circle cx="58" cy="20" r="2.4" stroke="#ffd400" stroke-width="1.8" opacity=".75"/>
  <!-- Lightning bolt -->
  <path fill="url(#bolt-gradient)" filter="url(#bolt-shadow)" d="m31.3 10.4-6.9 12H28L26 31l8.6-10.4h-4.7l3-7.3z"/>
  <!-- Pivot point -->
  <circle cx="26" cy="34" r="2.8" fill="#ffd400"/>
  <circle cx="26" cy="34" r="1" fill="#fff" fill-opacity=".6"/>
</svg>
